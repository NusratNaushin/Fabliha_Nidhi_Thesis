[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "version-aware-standardizer"
version = "0.1.0"
description = "Version-aware LOINC / SNOMED CT clinical terminology standardization and mapping audit engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "anyio>=4.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

# The console is plain files, not Python modules, so they have to be named
# explicitly or an installed copy would serve a 404 at /ui.
[tool.setuptools.package-data]
"backend.app" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: requires a running Snowstorm and/or a loaded SNOMED release",
    "validation: requires two real official terminology releases on disk",
    "slow: long running (performance) test",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
